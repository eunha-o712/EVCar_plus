<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 완료</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/common/main.css}">
    <link rel="stylesheet" th:href="@{/css/user/signupcomplete.css}">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="ev-signup-complete-page">
    <section class="ev-signup-complete-card">
        <p class="ev-signup-complete-eyebrow">EV CONSULTING</p>
        <h1 class="ev-signup-complete-title">회원가입 완료</h1>

        <p class="ev-signup-complete-welcome">
            <span th:text="${signupUser.name}"></span> 님, 환영합니다 🎉
        </p>
        <p class="ev-signup-complete-description">
            회원가입이 정상적으로 완료되었습니다.
        </p>

        <div class="ev-signup-complete-info">
            <dl>
                <div>
                    <dt>아이디</dt>
                    <dd th:text="${signupUser.loginId}"></dd>
                </div>
                <div>
                    <dt>이름</dt>
                    <dd th:text="${signupUser.name}"></dd>
                </div>
                <div>
                    <dt>생년월일</dt>
                    <dd th:text="${signupUser.birthDate}"></dd>
                </div>
                <div>
                    <dt>성별</dt>
                    <dd th:text="${signupUser.gender}"></dd>
                </div>
                <div>
                    <dt>전화번호</dt>
                    <dd th:text="${signupUser.phone}"></dd>
                </div>
                <div>
                    <dt>주소</dt>
                    <dd th:text="${signupUser.address}"></dd>
                </div>
                <div>
                    <dt>이메일</dt>
                    <dd th:text="${signupUser.email}"></dd>
                </div>
            </dl>

            <div class="ev-signup-complete-vehicle"
                 th:if="${signupUser.vehicleModel != null and signupUser.vehicleModel != ''}">
                <h2>보유 차량 정보</h2>
                <p>
                    <span th:text="${signupUser.vehicleModel}"></span>
                    <span>/</span>
                    <span th:text="${signupUser.vehicleYear}"></span>
                    <span>/</span>
                    <span th:text="${signupUser.drivingDistance}"></span>
                    <span>Km</span>
                </p>
            </div>
        </div>

        <div class="ev-signup-complete-privacy">
            <h2>수집된 정보 안내</h2>
            <p>
                입력하신 정보는 서비스 제공 및 회원 관리 목적으로만 사용되며,
                관련 법령에 따라 안전하게 보호됩니다.
            </p>
            <ul>
                <li>회원 식별 및 로그인 관리</li>
                <li>서비스 제공 및 고객 지원</li>
                <li>전기차 관련 맞춤 정보 제공</li>
            </ul>
        </div>

        <div class="ev-signup-complete-actions">
            <a th:href="@{/login}" class="ev-signup-complete-login-btn">로그인</a>
            <a th:href="@{/main}" class="ev-signup-complete-home-btn">메인으로</a>
        </div>
    </section>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/common/header.js}"></script>
<script th:src="@{/js/common/footer.js}"></script>
<script th:src="@{/js/common/main.js}"></script>
<script th:src="@{/js/user/signupcomplete.js}"></script>
</body>
</html>
