<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/common/main.css}">
    <link rel="stylesheet" th:href="@{/css/user/signup.css}">

    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script th:src="@{/js/user/country-code.js}"></script>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="ev-signup-page">
    <section class="ev-signup-card">
        <p class="ev-signup-eyebrow">EV CONSULTING</p>
        <h1 class="ev-signup-title">회원가입</h1>
        <p class="ev-signup-description">전기차 맞춤 상담 서비스를 이용하기 위해 회원 정보를 입력해주세요.</p>

        <form action="/signup" method="post" id="signupForm" novalidate>
            <input type="hidden" name="agreePrivacy" value="true">
            <input type="hidden" name="agreeTerms" value="true">
            <input type="hidden" name="email" id="emailFull">
            <input type="hidden" name="phone" id="fullPhone">

            <div class="ev-signup-section">
                <h2 class="ev-signup-section-title">기본 정보</h2>

                <div class="ev-signup-row">
                    <label for="loginId">아이디 <span>*</span></label>
                    <div class="ev-signup-inline">
                        <input type="text"
                               name="loginId"
                               id="loginId"
                               pattern="^[a-zA-Z0-9]{8,20}$"
                               title="영문이나 숫자 8~20자"
                               placeholder="영문/숫자 8~20자"
                               required>
                        <button type="button" class="ev-signup-sub-btn" id="checkIdBtn">중복확인</button>
                    </div>
                    <small id="idMsg" class="ev-signup-message"></small>
                </div>

                <div class="ev-signup-row">
                    <label for="password">비밀번호 <span>*</span></label>
                    <input type="password"
                           name="password"
                           id="password"
                           pattern="^(?=.*[a-zA-Z])(?=.*[0-9])[a-zA-Z0-9]{8,20}$"
                           placeholder="영문/숫자 포함 8~20자"
                           required>
                </div>

                <div class="ev-signup-row">
                    <label for="passwordConfirm">비밀번호 확인 <span>*</span></label>
                    <input type="password"
                           name="passwordConfirm"
                           id="passwordConfirm"
                           placeholder="비밀번호를 다시 입력해주세요"
                           required>
                    <small id="pwMsg" class="ev-signup-message"></small>
                </div>

                <div class="ev-signup-row">
                    <label for="name">이름 <span>*</span></label>
                    <input type="text"
                           name="name"
                           id="name"
                           pattern="^[가-힣a-zA-Z0-9]{1,50}$"
                           title="한글, 영문, 숫자 1~50자"
                           placeholder="한글/영문 50자 이내"
                           required>
                </div>

                <div class="ev-signup-row">
                    <label for="birthDate">생년월일 <span>*</span></label>
                    <input type="date"
                           id="birthDate"
                           name="birthDate"
                           min="1900-01-01"
                           required>
                </div>

                <div class="ev-signup-row">
                    <span class="ev-signup-label">성별 <em>*</em></span>
                    <div class="ev-signup-radio-group">
                        <label>
                            <input type="radio" name="gender" value="남" required>
                            남
                        </label>
                        <label>
                            <input type="radio" name="gender" value="여" required>
                            여
                        </label>
                    </div>
                </div>
            </div>

            <div class="ev-signup-section">
                <h2 class="ev-signup-section-title">연락처 정보</h2>

                <div class="ev-signup-row">
                    <label for="phone">전화번호 <span>*</span></label>
                    <div class="ev-signup-phone">
                        <select id="countryCode" aria-label="국가번호"></select>
                        <input id="phone"
                               placeholder="숫자만 입력"
                               required>
                    </div>
                </div>

                <div class="ev-signup-row">
                    <label for="address">주소 <span>*</span></label>
                    <div class="ev-signup-inline">
                        <input name="address"
                               id="address"
                               readonly
                               required>
                        <button type="button" class="ev-signup-sub-btn" id="addressSearchBtn">주소검색</button>
                    </div>
                </div>

                <div class="ev-signup-row">
                    <label for="addressDetail">상세주소</label>
                    <input name="addressDetail"
                           id="addressDetail"
                           placeholder="나머지 주소를 입력해주세요">
                </div>

                <div class="ev-signup-row">
                    <label>이메일 <span>*</span></label>
                    <div class="ev-signup-email">
                        <input type="text"
                               id="emailId"
                               name="emailId"
                               pattern="^[a-zA-Z0-9]+$"
                               title="영문 또는 숫자만 입력하세요"
                               required>
                        <span>@</span>
                        <input type="text"
                               id="emailDomain"
                               name="emailDomain"
                               pattern="^[a-zA-Z0-9]+\.[a-zA-Z]{2,}$"
                               title="예: gmail.com 형식으로 입력하세요"
                               required>
                        <select id="domainSelect">
                            <option value="">직접입력</option>
                            <option value="naver.com">naver.com</option>
                            <option value="daum.net">daum.net</option>
                            <option value="gmail.com">gmail.com</option>
                            <option value="nate.com">nate.com</option>
                        </select>
                        <button type="button" class="ev-signup-sub-btn" id="checkEmailBtn">중복확인</button>
                    </div>
                    <small id="emailMsg" class="ev-signup-message"></small>
                </div>
            </div>

            <div class="ev-signup-section">
                <h2 class="ev-signup-section-title">보유 차량 정보</h2>

                <div class="ev-signup-row">
                    <label for="carName">보유 차량명</label>
                    <input name="vehicleModel"
                           id="carName"
                           placeholder="보유 차량명을 입력하면 연식과 주행거리를 입력할 수 있습니다">
                </div>

                <div class="ev-signup-row">
                    <label for="carYear">보유차종 연식</label>
                    <input type="month"
                           name="vehicleYear"
                           id="carYear"
                           disabled>
                </div>

                <div class="ev-signup-row">
                    <label for="carMileage">주행거리(Km)</label>
                    <input name="drivingDistance"
                           id="carMileage"
                           placeholder="숫자만 입력"
                           disabled>
                </div>
            </div>

            <p class="ev-signup-note">* 는 필수 입력 항목입니다.</p>

            <div class="ev-signup-actions">
                <button type="button" class="ev-signup-submit-btn" id="signupSubmitBtn">가입하기</button>
                <button type="button" class="ev-signup-back-btn" id="signupBackBtn">돌아가기</button>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/common/header.js}"></script>
<script th:src="@{/js/common/footer.js}"></script>
<script th:src="@{/js/common/main.js}"></script>
<script th:src="@{/js/user/signup.js}"></script>
</body>
</html>
