<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="chatbot(userId)" th:if="${userId != null}">
    <div class="ev-floating-chatbot">

        <div class="ev-floating-chatbot__tooltip"
             id="evChatbotTooltip">
            HI~ AI 이카봇이에요 ⚡
        </div>

        <button type="button"
                class="ev-floating-chatbot__fab"
                id="evChatbotFab"
                aria-label="AI 챗봇 열기">

            <img src="/images/ev_chat_1.png"
                 alt="AI 챗봇"
                 class="ev-floating-chatbot__fab-icon">

        </button>

        <section class="ev-floating-chatbot__panel"
                 id="evChatbotPanel"
                 style="display: none;">

            <header class="ev-floating-chatbot__header">

                <div>
                    <strong>AI 상담 챗봇</strong>

                    <p>
                        무엇을 도와드릴까요?
                    </p>
                </div>

                <button type="button"
                        class="ev-floating-chatbot__close"
                        id="evChatbotClose"
                        aria-label="AI 챗봇 닫기">
                    ×
                </button>

            </header>

            <div class="ev-floating-chatbot__quick">

                <button type="button"
                        class="ev-floating-chatbot__quick-btn"
                        data-shortcut="recommend">
                    차량 추천
                </button>

                <button type="button"
                        class="ev-floating-chatbot__quick-btn"
                        data-shortcut="charging">
                    충전소 찾기
                </button>

                <button type="button"
                        class="ev-floating-chatbot__quick-btn"
                        data-shortcut="faq">
                    FAQ 상담
                </button>

                <button type="button"
                        class="ev-floating-chatbot__quick-btn"
                        data-shortcut="consultation">
                    상담 예약
                </button>

            </div>

            <div class="ev-floating-chatbot__messages"
                 id="evChatbotMessages">

                <div class="ev-floating-chatbot__message
                            ev-floating-chatbot__message--bot">

                    안녕하세요 ⚡<br>
                    EVCar AI 이카봇입니다.<br>
                    궁금한 내용을 입력해 주세요.

                </div>

            </div>

            <form class="ev-floating-chatbot__form"
                  id="evChatbotForm">

                <input type="hidden"
                       id="evChatbotUserId"
                       th:value="${userId}">

                <input type="text"
                       id="evChatbotInput"
                       class="ev-floating-chatbot__input"
                       placeholder="메시지를 입력하세요..."
                       autocomplete="off"
                       maxlength="300">

                <button type="submit"
                        class="ev-floating-chatbot__send">
                    전송
                </button>

            </form>

        </section>

    </div>

    <link rel="stylesheet"
          th:href="@{/css/chatbot/chatbot-widget.css}">

    <script th:src="@{/js/chatbot/chatbot-widget.js}"></script>

</div>

</body>
</html>
