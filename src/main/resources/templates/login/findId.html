<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/common/main.css}">
    <link rel="stylesheet" th:href="@{/css/login/findId.css}">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="ev-find-id-page">
    <section class="ev-find-id-card">
        <p class="ev-find-id-eyebrow">EV CONSULTING</p>
        <h1 class="ev-find-id-title">아이디 찾기</h1>
        <p class="ev-find-id-description">가입 시 입력한 이름과 이메일을 입력해주세요.</p>

        <form th:action="@{/login/find-id}" method="post" id="findIdForm">
            <div class="ev-find-id-field">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" placeholder="이름" required>
            </div>

            <div class="ev-find-id-field">
                <label>이메일</label>
                <div class="ev-find-id-email">
                    <input type="text" id="findEmailId" name="emailId" placeholder="이메일 아이디" required>
                    <span>@</span>
                    <input type="text" id="findEmailDomain" name="emailDomain" required>
                    <select id="findDomainSelect">
                        <option value="">직접입력</option>
                        <option value="naver.com">naver.com</option>
                        <option value="daum.net">daum.net</option>
                        <option value="gmail.com">gmail.com</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="ev-find-id-submit">아이디 찾기</button>
        </form>

        <div class="ev-find-id-links">
            <a th:href="@{/login}">로그인</a>
            <span>/</span>
            <a th:href="@{/login/reset-pw}">비밀번호 변경</a>
        </div>
    </section>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:inline="javascript">
    window.evFindIdMessage = {
        foundId: /*[[${foundId}]]*/ null,
        errorMessage: /*[[${errorMessage}]]*/ null
    };
</script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/common/header.js}"></script>
<script th:src="@{/js/common/footer.js}"></script>
<script th:src="@{/js/common/main.js}"></script>
<script th:src="@{/js/login/findId.js}"></script>
</body>
</html>
