<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 비밀번호 설정</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/common/main.css}">
    <link rel="stylesheet" th:href="@{/css/login/pwreset.css}">
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="ev-pwreset-page">
    <section class="ev-pwreset-card">
        <p class="ev-pwreset-eyebrow">EV CONSULTING</p>
        <h1 class="ev-pwreset-title">새 비밀번호 설정</h1>
        <p class="ev-pwreset-description">새로운 비밀번호를 입력해주세요.</p>

        <form th:action="@{/login/change-pw}"
              th:object="${passwordResetDto}"
              method="post"
              id="pwForm">

            <input type="hidden" th:field="*{loginId}">
            <input type="hidden" th:field="*{name}">
            <input type="hidden" th:field="*{email}">

            <div class="ev-pwreset-field">
                <label for="loginIdView">아이디</label>
                <input type="text" id="loginIdView" th:value="*{loginId}" readonly>
            </div>

            <div class="ev-pwreset-field">
                <label for="nameView">이름</label>
                <input type="text" id="nameView" th:value="*{name}" readonly>
            </div>

            <div class="ev-pwreset-field">
                <label for="emailView">이메일</label>
                <input type="email" id="emailView" th:value="*{email}" readonly>
            </div>

            <div class="ev-pwreset-field">
                <label for="newPassword">새 비밀번호</label>
                <input type="password"
                       id="newPassword"
                       th:field="*{newPassword}"
                       placeholder="영문과 숫자 포함 8~20자"
                       pattern="^(?=.*[a-zA-Z])(?=.*[0-9])[a-zA-Z0-9]{8,20}$"
                       title="비밀번호는 영문과 숫자를 포함한 8~20자입니다."
                       required>
            </div>

            <div class="ev-pwreset-field">
                <label for="newPasswordConfirm">비밀번호 확인</label>
                <input type="password"
                       id="newPasswordConfirm"
                       th:field="*{newPasswordConfirm}"
                       placeholder="비밀번호를 다시 입력하세요"
                       required>
            </div>

            <div class="ev-pwreset-actions">
                <button type="submit" class="ev-pwreset-submit">변경하기</button>
                <button type="button" class="ev-pwreset-back" data-login-url="/login">돌아가기</button>
            </div>
        </form>

        <div th:if="${errorMessage}" class="ev-pwreset-msg">
            <span th:text="${errorMessage}"></span>
        </div>

        <div th:if="${successMessage}" class="ev-pwreset-msg ev-pwreset-msg--success">
            <span th:text="${successMessage}"></span>
        </div>
    </section>
</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script th:inline="javascript">
    window.evPwresetMessage = {
        successMessage: /*[[${successMessage}]]*/ null,
        errorMessage: /*[[${errorMessage}]]*/ null
    };
</script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/common/header.js}"></script>
<script th:src="@{/js/common/footer.js}"></script>
<script th:src="@{/js/common/main.js}"></script>
<script th:src="@{/js/login/pwreset.js}"></script>
</body>
</html>
